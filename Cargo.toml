[package]
name = "fpn-yolo"
authors = ["Brandon Friend"]
version = "0.1.0"
edition = "2024"

[lib]
name = "fpn_yolo_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0.98"
candle-core = { version = "0.9.1", features = ["cuda"] }
candle-nn = "0.9.1"
opencv = { version = "0.95.1", features = ["dnn"] }
serde = { version = "1.0.219", features = ["derive"] }
clap = { version = "4.0", features = ["derive"] }
rayon = "1.8"
crossbeam-channel = "0.5"
parking_lot = "0.12"
num_cpus = "1.16"

# Performance improvements
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
wide = "0.7"  # SIMD operations
memmap2 = "0.9"  # Memory mapping for large datasets
dashmap = "6.1.0"  # Concurrent hashmap
once_cell = "1.19"  # Global static initialization
smallvec = "1.13"  # Stack-allocated vectors
bumpalo = "3.14"  # Bump allocator for temp allocations

# WebGPU/WGSL shader support for compute acceleration (optional)
wgpu = { version = "26.0.1", optional = true }
bytemuck = { version = "1.18", features = ["derive"], optional = true }
pollster = { version = "0.4", optional = true }  # For blocking on async WebGPU operations
futures-intrusive = { version = "0.5", optional = true }  # For async channel operations

# Optional Python bindings
pyo3 = { version = "0.25.1", features = ["auto-initialize", "extension-module"], optional = true }
numpy = { version = "0.25.0", optional = true }

[features]
default = []
python-bindings = ["pyo3", "numpy"]
webgpu-shaders = ["wgpu", "bytemuck", "pollster", "futures-intrusive"]
