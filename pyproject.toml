[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "fpn-yolo-rs"
version = "0.1.0"
description = "FPN-enhanced YOLO object detection with Rust backend"
authors = [
    {name = "Brandon Friend"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.20.0",
    "opencv-python>=4.5.0",
]

[project.optional-dependencies]
gpu = [
    "cupy-cuda12x>=10.0.0",
]
jax = [
    "jax[cuda12_pip]>=0.4.0",
    "jaxlib",
    "optax",
    "flax",
]
torch = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "torchaudio>=2.0.0",
]
dev = [
    "pytest>=6.0",
    "pytest-benchmark",
    "black",
    "isort",
    "mypy",
    "pre-commit",
    "maturin>=1.0",
]
all = [
    "cupy-cuda12x>=10.0.0",
    "jax[cuda12_pip]>=0.4.0",
    "jaxlib",
    "optax",
    "flax",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "torchaudio>=2.0.0",
    "pytest>=6.0",
    "pytest-benchmark",
    "black",
    "isort",
    "mypy",
    "pre-commit",
    "maturin>=1.0",
]

[project.urls]
Repository = "https://github.com/ionthedev/YOLO-FPN-RS"

[tool.maturin]
features = ["pyo3/auto-initialize", "python-bindings"]
module-name = "fpn_yolo_rs"

[tool.black]
line-length = 100
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
